# Benchmark profile: real HTTP/MySQL/ingest, but no external AI calls or mutations.
server:
  listen_addr: "0.0.0.0"
  port: 18080
  auth_token: "${AUTH_TOKEN}"
mysql:
  dsn: "${MYSQL_DSN}"
correlate:
  group_by: [labels.service]
  window_minutes: 15
  min_alerts: 1
diagnose:
  # Test alerts use info and the normal skip route. This is NOT LLM throughput.
  severity_route:
    critical: full
    high: full
    warning: light
    info: skip
    low: skip
  evidence:
    docker_socket: /not-mounted/docker.sock
    docker_container: ""
    sub2api_base_url: ""
    postgres_dsn: ""
    redis_addr: ""
approval:
  dry_run: true
  auto_execute_l2: false
tools:
  docker:
    allowed_containers: []
  # Registration requires a syntactically valid URL; benchmark never queries it.
  prometheus:
    base_url: http://127.0.0.1:9090
notify:
  im:
    provider: ""
    webhook: ""
web:
  base_url: http://127.0.0.1:18081
