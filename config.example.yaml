# D01 示例。敏感值使用 ${ENV} 占位符；IM webhook 可选，Web 控制台为公开操作面。
# 最小配置只写 mysql.dsn 时只需 MYSQL_DSN；配置 web.base_url 后启用匿名控制台。
# validate() 除了要求 mysql.dsn 非空，还会校验全部数值字段的边界。
# （超时、TTL、验证窗口、诊断预算、限频等）：无效值直接启动失败。
# 未知/已删除配置键和多个 YAML 文档也会被拒绝。
server:
  # 独立运行默认 127.0.0.1；此处为 Compose 的 host.docker.internal 显式绑定所有网卡。
  # 必须用宿主防火墙限制整个 listener 到可信来源；匿名控制台、写接口和 /metrics 禁止暴露公网。
  listen_addr: "0.0.0.0"
  port: 18080
  auth_token: "${AUTH_TOKEN}"
mysql:
  dsn: "${MYSQL_DSN}"
llm:
  roles:
    reasoner:
      base_url: "https://your-openai-compatible-endpoint"
      api_key: "${ARK_KEY}"
      model: "deepseek-v4-flash"
      max_tokens: 8192
      thinking:
        enabled: false
  # 运行时切换只能从此 allowlist 选择；不要加入未经授权的模型。
  models:
    - id: "deepseek-v4-flash"
      # 官方标称 1M；第三方网关可能有更低限制，应按实际接入能力配置。
      context_window_tokens: 1000000
      thinking:
        enabled: false
ingest:
  fingerprint_fields: []
  severity_label: severity
  full_dedup_ignore: [starts_at, ends_at, received_at]
correlate:
  group_by: [labels.service]
  window_minutes: 15
  min_alerts: 1
diagnose:
  budget:
    # 图执行步数只作异常兜底；模型和工具批次各占一步。
    full_steps: 32
    light_steps: 16
  severity_route:
    critical: full
    high: full
    warning: light
    info: skip
    low: skip
  evidence:
    sub2api_base_url: "${SUB2API_BASE_URL}"
    sub2api_metrics_job: sub2api
    postgres_dsn: "${PG_RO_DSN}"
    redis_addr: "${REDIS_ADDR}"
    redis_password: "${REDIS_PASSWORD}"
    docker_container: sub2api
    docker_socket: /var/run/docker.sock
    timeout_seconds: 5
    log_max_lines: 200
  # 恢复验证超时独立于 evidence；要求 0 < timeout < interval < window，且 timeout < 30 秒。
  verification:
    interval_seconds: 10
    window_seconds: 120
    timeout_seconds: 5
memory:
  ttl_seconds: 3600
  only_high_confidence: true
  cmd_history_inject: 5
approval:
  ttl_minutes: 30
  auto_execute_l2: false
  dry_run: true
  # L2 自动路径限频：同一 target+action 在窗口内最多自动执行 l2_max_per_window 次，
  # 超限降级为人工审批。
  l2_rate_window_minutes: 60
  l2_max_per_window: 1
tools:
  docker:
    allowed_containers: [sub2api]
    # 工具层兜底限频：即使决策放行，同一容器也不能被高频重启。
    restart_min_interval_seconds: 60
    restart_max_per_hour: 3
  prometheus:
    base_url: "http://127.0.0.1:9090"
    range_minutes: 15
    max_points: 300
  logs:
    enabled: false
    provider: cls
    region: ap-guangzhou
    topic_id: "${CLS_TOPIC}"
  mysql_select:
    dsn: "${MYSQL_RO_DSN}"
notify:
  im:
    # Supported: "" (disabled), wecom/feishu webhook, or feishu_app.
    provider: ""
    # Optional legacy webhook; leave empty unless provider is enabled.
    webhook: ""
    # feishu_app configuration (all fields are required when selected):
    # feishu:
    #   app_id: "${FEISHU_APP_ID}"
    #   app_secret: "${FEISHU_APP_SECRET}"
    #   verification_token: "${FEISHU_VERIFICATION_TOKEN}"
    #   encrypt_key: "${FEISHU_ENCRYPT_KEY}"
    #   chat_id: "${FEISHU_CHAT_ID}"
    #   web_base_url: "https://oncall.example.com"
web:
  base_url: "http://127.0.0.1:18080"  # 非空即启用匿名控制台；不是监听地址或访问控制
  # 飞书审批卡片的操作人 open_id 白名单（仅约束飞书回调，不影响公开控制台）。
  operator_allowlist: []
