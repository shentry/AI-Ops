# Production routing. Secrets are files under ./secrets (see ../README.md).
global:
  resolve_timeout: 5m

route:
  receiver: oncall-agent
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    # Heartbeat to an external dead man's switch, off this host.
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    # Monitoring failures reach people directly: the Agent may be what failed.
    # continue: the Agent still records them.
    - matchers: [layer="monitoring"]
      receiver: humans
      continue: true
    - matchers: [layer="monitoring"]
      receiver: oncall-agent

receivers:
  - name: oncall-agent
    webhook_configs:
      - url: "http://host.docker.internal:18080/webhook/alertmanager"
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/agent_token
  - name: humans
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/human_webhook_url
        send_resolved: true
  - name: heartbeat
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/heartbeat_url
        send_resolved: false
