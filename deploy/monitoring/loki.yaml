# Single-binary Loki for the sub2api host. Logs arrive from Alloy only; the
# agent queries them read-only through loki_query. No authentication: the port
# binds to 127.0.0.1 and the container sits on the monitoring network only.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-09-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Without retention_enabled the compactor only compacts and Loki never deletes
# anything. Marked chunks are removed retention_delete_delay after marking.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: 168h

analytics:
  reporting_enabled: false
