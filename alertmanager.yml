# 本地 Compose：Prometheus 告警经 Alertmanager 推到宿主机 oncall-agent。
# url 端口必须和 config.yaml 的 server.port 一致；Bearer 与 AUTH_TOKEN 一致。
global:
  resolve_timeout: 5m

route:
  receiver: oncall-agent
  group_by: [alertname, service]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    # The dev stack has no external heartbeat receiver.
    - matchers: [alertname="Watchdog"]
      receiver: discard

receivers:
  - name: discard
  - name: oncall-agent
    webhook_configs:
      - url: "http://host.docker.internal:18080/webhook/alertmanager"
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: "devtoken"
