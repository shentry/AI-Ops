global:
  resolve_timeout: 5m

route:
  receiver: oncall-agent
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: oncall-agent
    webhook_configs:
      - url: "http://host.docker.internal:8080/webhook/alertmanager"
        send_resolved: true
