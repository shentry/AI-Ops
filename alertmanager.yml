# D01 的 Alertmanager 配置。webhook 地址是以后 D03 的接收端。
# send_resolved 必须保持 true，D03/D05 才能关掉告警和 incident。
global:
  resolve_timeout: 5m

route:
  receiver: oncall-agent
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: oncall-agent
    webhook_configs:
      - url: "http://host.docker.internal:8080/webhook/alertmanager"
        send_resolved: true
