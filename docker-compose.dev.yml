# 本地依赖。server 跑在宿主机上，通过 localhost:3306 连 MySQL。
# Alertmanager 往 host.docker.internal:18080 推 webhook（与 config.yaml server.port 一致）。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oncall-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oncall}
      MYSQL_USER: ${MYSQL_USER:-oncall}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oncall-pass}
    ports:
      - "3306:3306"
    volumes:
      - oncall-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.external-url=http://127.0.0.1:9090
      - --web.enable-lifecycle
    depends_on:
      - alertmanager
      - blackbox

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://127.0.0.1:9093

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    ports:
      - "9115:9115"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./blackbox.yml:/config/blackbox.yml:ro
    command:
      - --config.file=/config/blackbox.yml

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - "9100:9100"

volumes:
  oncall-mysql-data:
  prometheus-data:
  alertmanager-data:
