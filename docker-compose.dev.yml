services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oncall-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oncall}
      MYSQL_USER: ${MYSQL_USER:-oncall}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oncall-pass}
    ports:
      - "3306:3306"
    volumes:
      - oncall-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - "9100:9100"

volumes:
  oncall-mysql-data:
  prometheus-data:
  alertmanager-data:
